<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="format-detection" content="telephone=no" />
  <title>DiterShoes · Catálogo de Tenis</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="DiterShoes" />
  <meta name="description" content="Modelos de tenis Ditershoes. Tallas 3 al 6 MX." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">DITERSHOES</a>
    <nav>
      <a href="catalogo.html" aria-current="page">Catálogo</a>
    </nav>
  </header>

  <main>
    <section class="catalog">
      <h2>Modelos</h2>
      <div class="filters" id="filters"></div>
      <div class="grid" id="grid"></div>
    </section>
  </main>

  <button type="button" class="to-top" hidden aria-label="Volver arriba">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 14l6-6 6 6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>

  <footer>
    <strong>DITERSHOES</strong>
    <span>662 174 6719 · 662 138 3780</span>
  </footer>

  <dialog id="lightbox">
    <form method="dialog"><button class="close" aria-label="Cerrar">×</button></form>
    <img id="lightbox-img" alt="" />
    <p id="lightbox-cap"></p>
  </dialog>

  <script src="app.js"></script>
  <script src="top.js"></script>
</body>
</html>
